(function (App) {
  'use strict';

  const { store, utils } = App;

  // Everything the commissioner needs to re-enter results into Sleeper by hand
  // afterward, plus a raw JSON backup that can be re-imported into this app.

  function csvCell(value) {
    const s = value === null || value === undefined ? '' : String(value);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function toCsv(rows) {
    return rows.map((row) => row.map(csvCell).join(',')).join('\r\n');
  }

  /**
   * Filenames carry the draft's key, so exports from two drafts (or two points
   * in one draft) never overwrite each other in the downloads folder.
   */
  function stamp() {
    const state = store.get();
    const key = (state && (state.draftKey || state.draftId)) || 'draft';
    return key.replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
  }

  App.exporter = {
    picksCsv() {
      const state = store.get();
      const rows = [
        ['Pick #', 'Timestamp', 'Player', 'Pos', 'NFL Team', 'Fantasy Team', 'Manager', 'Price', 'Slot'],
      ];
      state.picks.forEach((pick, i) => {
        const team = store.teamById(pick.teamId);
        rows.push([
          i + 1,
          pick.timestamp,
          pick.playerName,
          pick.position,
          pick.nflTeam,
          team ? team.name : '',
          team ? team.manager : '',
          pick.price,
          pick.slot,
        ]);
      });
      return toCsv(rows);
    },

    rostersCsv() {
      const state = store.get();
      const slots = store.expandSlots();
      const header = ['Slot'];
      for (const team of state.teams) header.push(team.name, '$');
      const rows = [header];

      const bySlot = new Map(state.picks.map((p) => [`${p.teamId}::${p.slot}`, p]));
      for (const slot of slots) {
        const row = [slot.label];
        for (const team of state.teams) {
          const pick = bySlot.get(`${team.id}::${slot.code}`);
          row.push(pick ? pick.playerName : '', pick ? pick.price : '');
        }
        rows.push(row);
      }

      const totals = ['TOTAL'];
      for (const team of state.teams) totals.push('', store.teamSummary(team.id).spent);
      rows.push(totals);
      return toCsv(rows);
    },

    /** Plain text grouped by team -- the version to read off while typing into Sleeper. */
    rostersText() {
      const state = store.get();
      const title = state.name ? `${state.name} — auction draft results` : 'AUCTION DRAFT RESULTS';
      const lines = [title, new Date().toLocaleString(), ''];

      for (const team of state.teams) {
        const summary = store.teamSummary(team.id);
        lines.push(`${team.name}${team.manager ? ` (${team.manager})` : ''}`);
        lines.push(
          `  spent ${utils.money(summary.spent)} of ${utils.money(summary.budget)} · ` +
            `${summary.filled} players · ${utils.money(summary.remaining)} left`
        );
        const picks = store.picksFor(team.id).slice().sort((a, b) => b.price - a.price);
        if (!picks.length) lines.push('  (no players)');
        for (const pick of picks) {
          const label = `${pick.playerName} (${pick.position}${pick.nflTeam ? `-${pick.nflTeam}` : ''})`;
          lines.push(`  ${utils.money(pick.price).padStart(5)}  ${label}`);
        }
        lines.push('');
      }
      return lines.join('\n');
    },

    stateJson() {
      return JSON.stringify(store.get(), null, 2);
    },

    downloadPicksCsv() {
      utils.downloadFile(`${stamp()}-picks.csv`, App.exporter.picksCsv(), 'text/csv');
    },
    downloadRostersCsv() {
      utils.downloadFile(`${stamp()}-rosters.csv`, App.exporter.rostersCsv(), 'text/csv');
    },
    downloadRostersText() {
      utils.downloadFile(`${stamp()}-rosters.txt`, App.exporter.rostersText());
    },
    downloadStateJson() {
      utils.downloadFile(`${stamp()}-backup.json`, App.exporter.stateJson(), 'application/json');
    },
  };
})(window.DraftApp);

(function (App) {
  'use strict';

  const { el, clear, timeAgo } = App.utils;

  // A persistent, glanceable pill. The important message it carries: red means
  // the spreadsheet copy is behind, NOT that anything was lost. The draft is
  // always safe locally, so the correct response to red is to keep going.

  const LABELS = {
    idle: ['Ready', 'ok'],
    pending: ['Saving…', 'busy'],
    syncing: ['Saving…', 'busy'],
    synced: ['Saved', 'ok'],
    offline: ['Offline', 'warn'],
    error: ['Sheet behind', 'bad'],
    disabled: ['Local only', 'muted'],
  };

  let node = null;

  function render(snapshot) {
    if (!node) return;
    const [label, kind] = LABELS[snapshot.status] || LABELS.idle;
    clear(node);
    node.className = `syncpill syncpill--${kind}`;
    node.title =
      (snapshot.detail || '') +
      (snapshot.lastSyncedAt ? `\nLast saved to the sheet ${timeAgo(snapshot.lastSyncedAt)}` : '') +
      '\nPicks are always saved on this computer first.';
    node.append(
      el('span', { class: 'syncpill__dot' }),
      el('span', { class: 'syncpill__text', text: label })
    );
  }

  App.views = App.views || {};
  App.views.syncStatus = {
    mount(container) {
      node = el('div', { class: 'syncpill syncpill--ok', role: 'status' });
      container.append(node);
      App.bus.on('sync:status', render);
      render(App.sync.snapshot());
      // Keep the relative "last saved" time in the tooltip fresh.
      setInterval(() => render(App.sync.snapshot()), 20000);
    },
  };
})(window.DraftApp);

(function (App) {
  'use strict';

  const { el, clear, money, debounce } = App.utils;
  const { store, players, validation } = App;

  // The operator types here dozens of times in a row under social pressure, so
  // the whole flow is keyboard-driven: type a name, arrow to the player, Enter,
  // type a price, Enter. Nothing waits on the network.

  let selectedPlayer = null;
  let highlighted = -1;
  let results = [];
  let pendingSlot = null;

  let nameInput, priceInput, teamSelect, resultsBox, feedback, slotBox, submitBtn;

  function positionOf() {
    return selectedPlayer ? selectedPlayer.p : '';
  }

  function currentDraft() {
    return {
      teamId: teamSelect.value,
      playerId: selectedPlayer ? selectedPlayer.id : '',
      playerName: selectedPlayer ? selectedPlayer.n : nameInput.value.trim(),
      position: positionOf(),
      price: priceInput.value === '' ? NaN : Number(priceInput.value),
      slot: pendingSlot,
    };
  }

  function renderResults() {
    clear(resultsBox);
    if (!results.length) {
      resultsBox.hidden = true;
      return;
    }
    resultsBox.hidden = false;
    results.forEach((player, i) => {
      resultsBox.append(
        el(
          'div',
          {
            class: `ac__item${i === highlighted ? ' is-active' : ''}${player.drafted ? ' is-drafted' : ''}`,
            role: 'option',
            'aria-selected': i === highlighted,
            onmousedown: (e) => {
              e.preventDefault();
              choose(i);
            },
          },
          [
            el('span', { class: 'ac__name', text: player.n }),
            // No team means Sleeper has them as a free agent -- label it rather
            // than showing a blank, so it doesn't look like missing data.
            el('span', { class: 'ac__meta', text: `${player.p} · ${player.t || 'FA'}` }),
            player.drafted ? el('span', { class: 'ac__taken', text: 'drafted' }) : null,
          ]
        )
      );
    });
  }

  const runSearch = debounce(() => {
    const term = nameInput.value;
    results = players.isLoaded() ? players.search(term, { excludeIds: store.draftedPlayerIds() }) : [];
    highlighted = results.length ? 0 : -1;
    renderResults();
  }, 60);

  function choose(index) {
    const player = results[index];
    if (!player) return;
    selectedPlayer = player;
    nameInput.value = player.n;
    results = [];
    highlighted = -1;
    renderResults();
    pendingSlot = null;
    revalidate();
    priceInput.focus();
    priceInput.select();
  }

  function renderSlotChoice(options) {
    clear(slotBox);
    // Only ask when the choice is genuinely ambiguous; one option auto-assigns.
    if (!options || options.length <= 1) {
      slotBox.hidden = true;
      pendingSlot = options && options.length ? options[0].code : null;
      return;
    }
    slotBox.hidden = false;
    if (!options.some((o) => o.code === pendingSlot)) pendingSlot = options[0].code;
    slotBox.append(el('span', { class: 'slot-choice__label', text: 'Slot' }));
    for (const option of options) {
      slotBox.append(
        el('button', {
          type: 'button',
          class: `chip${option.code === pendingSlot ? ' is-active' : ''}`,
          text: option.label,
          onclick: () => {
            pendingSlot = option.code;
            revalidate();
          },
        })
      );
    }
  }

  function revalidate() {
    const draft = currentDraft();
    const result = validation.check(draft);
    renderSlotChoice(result.slotOptions);

    clear(feedback);
    for (const blocker of result.blockers) {
      if (blocker.code === 'no_team' || blocker.code === 'no_player' || blocker.code === 'bad_price') continue;
      feedback.append(
        el('p', {
          class: `feedback feedback--${blocker.overridable ? 'warn' : 'error'}`,
          text: blocker.message,
        })
      );
    }
    for (const warning of result.warnings) {
      feedback.append(el('p', { class: 'feedback feedback--warn', text: warning.message }));
    }

    const hard = result.blockers.some((b) => !b.overridable);
    submitBtn.disabled = hard;
    submitBtn.textContent = result.canOverride ? 'Add anyway' : 'Add pick';
    submitBtn.classList.toggle('btn--warn', result.canOverride);

    // Flag teams that can't legally win the current bid, so the operator sees
    // it in the list rather than after choosing.
    const price = currentDraft().price;
    for (const info of App.validation.eligibleTeams(price)) {
      const option = teamSelect.querySelector(`option[value="${info.id}"]`);
      if (!option) continue;
      option.textContent = info.eligible ? info.name : `${info.name} — ${info.reason}`;
      option.disabled = info.summary.open === 0;
    }

    // Live max-bid hint for the selected team.
    const team = teamSelect.value ? store.teamSummary(teamSelect.value) : null;
    const hint = document.getElementById('entry-hint');
    if (hint) {
      hint.textContent = team
        ? `${money(team.remaining)} left · ${team.open} spot${team.open === 1 ? '' : 's'} · max bid ${money(team.maxBid)}`
        : '';
    }
    return result;
  }

  function reset() {
    selectedPlayer = null;
    pendingSlot = null;
    results = [];
    highlighted = -1;
    nameInput.value = '';
    priceInput.value = '';
    renderResults();
    clear(slotBox);
    slotBox.hidden = true;
    clear(feedback);
    nameInput.focus();
  }

  function submit() {
    const draft = currentDraft();
    const result = validation.check(draft);
    if (result.blockers.some((b) => !b.overridable)) return;

    if (result.blockers.length) {
      const lines = result.blockers.map((b) => `• ${b.message}`).join('\n');
      if (!window.confirm(`${lines}\n\nAdd this pick anyway?`)) return;
    }

    store.addPick({
      ...draft,
      slot: pendingSlot || (result.slotOptions[0] && result.slotOptions[0].code) || '',
      overrides: validation.overrideFlags(result.blockers),
    });
    reset();
    revalidate();
  }

  App.views = App.views || {};
  App.views.entry = {
    render(container) {
      clear(container);

      nameInput = el('input', {
        type: 'text',
        id: 'entry-player',
        class: 'entry__player',
        placeholder: players.isLoaded() ? 'Player name…' : 'Player name (type it out)',
        autocomplete: 'off',
        'aria-autocomplete': 'list',
        oninput: () => {
          selectedPlayer = null;
          runSearch();
          revalidate();
        },
        onkeydown: (e) => {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            highlighted = Math.min(highlighted + 1, results.length - 1);
            renderResults();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            highlighted = Math.max(highlighted - 1, 0);
            renderResults();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (highlighted >= 0 && results.length) choose(highlighted);
            else priceInput.focus();
          } else if (e.key === 'Escape') {
            results = [];
            renderResults();
          }
        },
        onblur: () => {
          setTimeout(() => {
            results = [];
            renderResults();
          }, 120);
        },
      });

      resultsBox = el('div', { class: 'ac', role: 'listbox', hidden: true });

      teamSelect = el(
        'select',
        {
          id: 'entry-team',
          class: 'entry__team',
          onchange: () => {
            pendingSlot = null;
            revalidate();
          },
        },
        store.get().teams.map((t) => el('option', { value: t.id, text: t.name }))
      );

      priceInput = el('input', {
        type: 'number',
        id: 'entry-price',
        class: 'entry__price',
        min: '0',
        step: '1',
        placeholder: '$',
        oninput: revalidate,
        onkeydown: (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            submit();
          }
        },
      });

      slotBox = el('div', { class: 'slot-choice', hidden: true });
      feedback = el('div', { class: 'entry__feedback' });
      submitBtn = el('button', { type: 'button', class: 'btn btn--primary', text: 'Add pick', onclick: submit });

      container.append(
        el('div', { class: 'entry' }, [
          el('div', { class: 'entry__row' }, [
            el('div', { class: 'entry__field entry__field--grow' }, [
              el('label', { for: 'entry-player', class: 'entry__label', text: 'Player' }),
              nameInput,
              resultsBox,
            ]),
            el('div', { class: 'entry__field' }, [
              el('label', { for: 'entry-team', class: 'entry__label', text: 'Won by' }),
              teamSelect,
            ]),
            el('div', { class: 'entry__field entry__field--price' }, [
              el('label', { for: 'entry-price', class: 'entry__label', text: 'Price' }),
              priceInput,
            ]),
            submitBtn,
          ]),
          el('div', { class: 'entry__row entry__row--sub' }, [
            el('span', { id: 'entry-hint', class: 'muted small' }),
            slotBox,
          ]),
          feedback,
        ])
      );

      revalidate();
      nameInput.focus();
    },

    focus() {
      if (nameInput) nameInput.focus();
    },

    refresh() {
      if (!teamSelect) return;
      // Team list can change if the operator edits setup mid-draft.
      const current = teamSelect.value;
      clear(teamSelect);
      for (const t of store.get().teams) {
        teamSelect.append(el('option', { value: t.id, text: t.name }));
      }
      if (store.teamById(current)) teamSelect.value = current;
      revalidate();
    },

    /** Recompute the budget hint after any state change (undo, edit, delete). */
    revalidate() {
      if (teamSelect) revalidate();
    },
  };
})(window.DraftApp);

(function (App) {
  'use strict';

  const { el, clear, money } = App.utils;
  const { store } = App;

  // The shared screen. Everything here is sized to be read from across a room,
  // so it shows only what the room actually cares about: who has money left,
  // what each team has bought, and what just went.
  //
  // Deliberately NOT a full slot grid -- a dozen empty bench rows per team is a
  // wall of dashes that pushes the real information off screen. Filled spots
  // are listed; what's still needed is summarised in one line underneath.

  const RECENT_COUNT = 6;

  /**
   * Team columns are narrow (a 12-team league leaves ~140px), so the board
   * shows surnames the way a physical draft board does -- "Jefferson", not
   * "Justin Jefferson". The position tag beside it resolves the rare clash, and
   * the full name is still in the tooltip, the pick list, and every export.
   */
  function boardName(fullName) {
    const parts = fullName.trim().split(/\s+/);
    if (parts.length < 2) return fullName;
    // "SF Defense" and the like read better whole.
    if (/^(defense|dst|d\/st)$/i.test(parts[parts.length - 1])) return fullName;
    const last = parts.slice(1).join(' ');
    // Drop a trailing suffix: "Marvin Harrison Jr." -> "Harrison Jr."
    return last;
  }

  function needsLine(teamId) {
    const open = store.openSlotCodes(teamId);
    if (!open.length) return null;
    // Collapse BN1..BN6 into "BN x6" rather than listing each one.
    const counts = new Map();
    for (const slot of open) counts.set(slot.slotKey, (counts.get(slot.slotKey) || 0) + 1);
    const parts = [];
    for (const [key, count] of counts) parts.push(count > 1 ? `${key}×${count}` : key);
    return parts.join(' · ');
  }

  function teamColumn(team, nominatorId) {
    const summary = store.teamSummary(team.id);
    const picks = store.picksFor(team.id).slice().sort((a, b) => b.price - a.price);
    const pctSpent = summary.budget ? Math.min(100, (summary.spent / summary.budget) * 100) : 0;
    const needs = needsLine(team.id);
    const broke = summary.open > 0 && summary.maxBid <= store.minBid();
    const nominating = team.id === nominatorId;

    return el('div', {
      class:
        'team-col' +
        (summary.open === 0 ? ' is-full' : '') +
        (nominating ? ' is-nominating' : ''),
    }, [
      nominating ? el('div', { class: 'team-col__flag', text: 'NOMINATING' }) : null,
      el('div', { class: 'team-col__head' }, [
        el('div', { class: 'team-col__name', text: team.name, title: team.name }),
        el('div', { class: 'team-col__budget' }, [
          el('span', { class: `team-col__left${broke ? ' is-low' : ''}`, text: money(summary.remaining) }),
          el('span', { class: 'team-col__of', text: `of ${money(summary.budget)}` }),
        ]),
        el('div', { class: 'meter', title: `${money(summary.spent)} spent` }, [
          el('div', { class: 'meter__fill', style: `width:${pctSpent}%` }),
        ]),
        el('div', { class: 'team-col__sub' }, [
          el('span', { text: `${summary.filled}/${summary.filled + summary.open}` }),
          el('span', { text: summary.open ? `max ${money(summary.maxBid)}` : 'full' }),
        ]),
      ]),

      picks.length
        ? el(
            'ul',
            { class: 'team-col__picks' },
            picks.map((pick) =>
              el('li', { class: 'pick', title: `${pick.playerName} — ${pick.slot}` }, [
                el('span', { class: `pick__pos pos-${pick.position}`, text: pick.position }),
                el('span', { class: 'pick__player', text: boardName(pick.playerName) }),
                el('span', { class: 'pick__price', text: money(pick.price) }),
              ])
            )
          )
        : el('div', { class: 'team-col__empty', text: 'nothing yet' }),

      needs ? el('div', { class: 'team-col__needs', title: 'Still to fill', text: needs }) : null,
    ]);
  }

  function recentStrip() {
    const picks = store.get().picks.slice(-RECENT_COUNT).reverse();
    if (!picks.length) {
      return el('div', { class: 'recent recent--empty' }, [
        el('span', { class: 'muted', text: 'No picks yet. Enter the first one above.' }),
      ]);
    }
    return el(
      'div',
      { class: 'recent' },
      picks.map((pick, i) => {
        const team = store.teamById(pick.teamId);
        return el('div', { class: `recent__item${i === 0 ? ' is-newest' : ''}` }, [
          el('span', { class: 'recent__price', text: money(pick.price) }),
          el('span', { class: 'recent__player', text: pick.playerName }),
          el('span', { class: 'recent__pos', text: pick.position }),
          el('span', { class: 'recent__team', text: team ? team.name : '' }),
        ]);
      })
    );
  }

  function summaryBar(nominatorId) {
    const state = store.get();
    const spent = state.picks.reduce((sum, p) => sum + p.price, 0);
    const totalBudget = state.teams.length * state.settings.budgetPerTeam;
    const totalSlots = state.teams.length * store.totalSlots();
    const nominator = nominatorId ? store.teamById(nominatorId) : null;
    return el('div', { class: 'summary' }, [
      nominator
        ? el('div', { class: 'summary__nominating' }, [
            el('span', { class: 'summary__lbl', text: 'nominating' }),
            el('span', { class: 'summary__team', text: nominator.name }),
          ])
        : null,
      el('div', { class: 'summary__stat' }, [
        el('span', { class: 'summary__num', text: String(state.picks.length) }),
        el('span', { class: 'summary__lbl', text: `of ${totalSlots} picks` }),
      ]),
      el('div', { class: 'summary__stat' }, [
        el('span', { class: 'summary__num', text: money(spent) }),
        el('span', { class: 'summary__lbl', text: `of ${money(totalBudget)} spent` }),
      ]),
      el('div', { class: 'summary__stat' }, [
        el('span', {
          class: 'summary__num',
          text: state.picks.length ? money(Math.max(...state.picks.map((p) => p.price))) : '—',
        }),
        el('span', { class: 'summary__lbl', text: 'top bid' }),
      ]),
    ]);
  }

  App.views = App.views || {};
  App.views.board = {
    render(container) {
      clear(container);
      const teams = store.get().teams;
      const nominatorId = store.currentNominator();
      const board = el('div', { class: 'board' }, teams.map((t) => teamColumn(t, nominatorId)));
      // Fit every team on one row: a wrapped final row of two columns reads as
      // a mistake on a shared screen.
      board.style.gridTemplateColumns = `repeat(${teams.length}, minmax(0, 1fr))`;
      container.append(summaryBar(nominatorId), recentStrip(), board);
    },
  };
})(window.DraftApp);

(function (App) {
  'use strict';

  const { el, clear, money } = App.utils;
  const { store } = App;

  // Full pick log with edit/delete. Mistakes happen live, and because sync is a
  // full snapshot, an edit here needs no special handling to reach the sheet.

  let editingId = null;
  let mount = null;

  function rerender() {
    if (mount) App.views.history.render(mount);
  }

  function editRow(pick) {
    const nameInput = el('input', { type: 'text', value: pick.playerName, class: 'mini' });
    const teamSelect = el(
      'select',
      { class: 'mini' },
      store.get().teams.map((t) =>
        el('option', { value: t.id, text: t.name, ...(t.id === pick.teamId ? { selected: true } : {}) })
      )
    );
    const priceInput = el('input', { type: 'number', min: '0', value: String(pick.price), class: 'mini' });

    // An edit goes through the same guardrails as a new pick. Without this it
    // was possible to edit a pick into a duplicate player, a full roster, or a
    // price above the team's legal max -- producing a draft that could not be
    // entered into Sleeper afterward, which is the one thing these rules exist
    // to guarantee.
    const save = () => {
      const changes = {
        playerName: nameInput.value.trim() || pick.playerName,
        teamId: teamSelect.value,
        price: Number(priceInput.value) || 0,
      };
      const result = App.validation.check({
        ...changes,
        playerId: pick.playerId,
        position: pick.position,
        slot: pick.slot,
        ignorePickId: pick.id,
      });

      const hard = result.blockers.filter((b) => !b.overridable);
      if (hard.length) {
        window.alert(`${hard.map((b) => `• ${b.message}`).join('\n')}\n\nThe edit was not saved.`);
        return;
      }
      if (result.blockers.length) {
        const lines = result.blockers.map((b) => `• ${b.message}`).join('\n');
        if (!window.confirm(`${lines}\n\nSave this edit anyway?`)) return;
      }

      store.updatePick(pick.id, changes);
      editingId = null;
      rerender();
    };

    priceInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') save();
    });

    return el('div', { class: 'hist__row hist__row--edit' }, [
      nameInput,
      teamSelect,
      priceInput,
      el('button', { type: 'button', class: 'btn btn--primary btn--sm', text: 'Save', onclick: save }),
      el('button', {
        type: 'button',
        class: 'btn btn--ghost btn--sm',
        text: 'Cancel',
        onclick: () => {
          editingId = null;
          rerender();
        },
      }),
    ]);
  }

  function readRow(pick, number) {
    const team = store.teamById(pick.teamId);
    return el('div', { class: 'hist__row' }, [
      el('span', { class: 'hist__num', text: `#${number}` }),
      el('span', { class: 'hist__player', text: pick.playerName }),
      el('span', {
        class: 'hist__pos',
        text: `${pick.position}${pick.nflTeam ? ` · ${pick.nflTeam}` : ''}`,
      }),
      el('span', { class: 'hist__team', text: team ? team.name : '—' }),
      el('span', { class: 'hist__slot', text: pick.slot }),
      el('span', { class: 'hist__price', text: money(pick.price) }),
      el('button', {
        type: 'button',
        class: 'btn btn--ghost btn--sm',
        text: 'Edit',
        onclick: () => {
          editingId = pick.id;
          rerender();
        },
      }),
      el('button', {
        type: 'button',
        class: 'btn btn--ghost btn--sm',
        text: 'Delete',
        onclick: () => {
          if (window.confirm(`Delete ${pick.playerName} (${money(pick.price)})?`)) {
            store.removePick(pick.id);
            rerender();
          }
        },
      }),
    ]);
  }

  App.views = App.views || {};
  App.views.history = {
    render(container) {
      mount = container;
      clear(container);

      const picks = store.get().picks;
      if (!picks.length) {
        container.append(el('p', { class: 'muted', text: 'No picks yet.' }));
        return;
      }

      const list = el('div', { class: 'hist' });
      // Newest first: that's the one most likely to need fixing.
      picks
        .slice()
        .reverse()
        .forEach((pick, i) => {
          const number = picks.length - i;
          list.append(pick.id === editingId ? editRow(pick) : readRow(pick, number));
        });

      container.append(list);
    },
  };
})(window.DraftApp);

</script>
    <script>
(function (App) {
  'use strict';

  const { el, clear } = App.utils;
  const { store, persistence, sync } = App;

  App.VERSION = '1.0.0';

  let screens = {};
  let readOnly = false;

  // --- theme -----------------------------------------------------------------

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    persistence.setPref('theme', theme);
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.textContent = theme === 'dark' ? '☾' : '☀';
      btn.title = `Switch to ${theme === 'dark' ? 'light' : 'dark'} mode`;
    }
  }

  function initTheme() {
    const saved = persistence.prefs().theme;
    const preferred =
      saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(preferred);
  }

  // --- rendering -------------------------------------------------------------

  function show(name) {
    for (const [key, node] of Object.entries(screens)) {
      node.hidden = key !== name;
    }
    document.body.dataset.screen = name;
  }

  function renderDraft() {
    App.views.board.render(screens.board.querySelector('.screen__body'));
    // The entry hint shows the selected team's remaining budget and max bid, so
    // it has to follow undo/edit/delete too -- not just picks added through it.
    App.views.entry.revalidate();
    if (document.body.dataset.panel === 'history') {
      App.views.history.render(document.getElementById('panel-body'));
    }
  }

  function openPanel(kind) {
    const panel = document.getElementById('panel');
    const body = document.getElementById('panel-body');
    const title = document.getElementById('panel-title');
    document.body.dataset.panel = kind;
    panel.hidden = false;

    if (kind === 'history') {
      title.textContent = 'All picks';
      App.views.history.render(body);
    } else if (kind === 'export') {
      title.textContent = 'Save & export';
      renderExportPanel(body);
    } else if (kind === 'recover') {
      title.textContent = 'Backup & recovery';
      renderRecoverPanel(body);
    }
  }

  function closePanel() {
    document.getElementById('panel').hidden = true;
    document.body.dataset.panel = '';
  }

  function renderExportPanel(body) {
    clear(body);
    body.append(
      el('p', {
        class: 'muted',
        text: 'Use the roster list when typing results into Sleeper afterward.',
      }),
      el('div', { class: 'btn-stack' }, [
        el('button', {
          class: 'btn btn--primary',
          text: 'Rosters (text)',
          onclick: () => App.exporter.downloadRostersText(),
        }),
        el('button', {
          class: 'btn',
          text: 'Rosters (CSV)',
          onclick: () => App.exporter.downloadRostersCsv(),
        }),
        el('button', {
          class: 'btn',
          text: 'Pick log (CSV)',
          onclick: () => App.exporter.downloadPicksCsv(),
        }),
        el('button', {
          class: 'btn',
          text: 'Full backup (JSON)',
          onclick: () => App.exporter.downloadStateJson(),
        }),
      ]),
      el('h3', { text: 'Copy & paste' }),
      el('textarea', { class: 'copybox', readonly: true, rows: '18', text: App.exporter.rostersText() })
    );
  }

  function renderRecoverPanel(body) {
    clear(body);
    const status = el('div', { class: 'note-slot' });

    body.append(
      el('p', {
        class: 'muted',
        text:
          'Every pick is saved on this computer the moment you enter it. The Google Sheet ' +
          'is a second copy in case something happens to this computer.',
      }),
      el('div', { class: 'btn-stack' }, [
        el('button', {
          class: 'btn',
          text: 'Save to sheet now',
          onclick: async () => {
            clear(status).append(el('span', { class: 'note', text: 'Saving…' }));
            await sync.flushNow('manual');
            const snap = sync.snapshot();
            clear(status).append(
              el('span', {
                class: `note note--${snap.status === 'synced' ? 'ok' : 'warn'}`,
                text: snap.status === 'synced' ? 'Saved to the sheet.' : snap.detail || snap.status,
              })
            );
          },
        }),
        el('button', {
          class: 'btn',
          text: 'Check the sheet’s copy',
          onclick: async () => {
            clear(status).append(el('span', { class: 'note', text: 'Checking…' }));
            const { verdict, remote } = await App.restore.compare(store.get());
            const messages = {
              match: 'The sheet matches this computer.',
              'local-ahead': 'This computer is ahead — use “Save to sheet now”.',
              'remote-ahead': `The sheet has a newer copy (${remote?.state.picks.length} picks).`,
              diverged:
                `The sheet disagrees with this screen (${remote?.state.picks.length} picks there, ` +
                `${store.get().picks.length} here). This computer's copy is the one you have been ` +
                'watching — use “Save to sheet now” unless you know otherwise.',
              'local-only': 'This draft is not in the sheet yet.',
              'remote-only': `The sheet has a draft with ${remote?.state.picks.length} picks.`,
              'no-remote': 'Could not reach the sheet. Your picks are still safe here.',
            };
            clear(status).append(el('span', { class: 'note note--info', text: messages[verdict] }));

            if ((verdict === 'remote-ahead' || verdict === 'remote-only') && remote) {
              status.append(
                el('button', {
                  class: 'btn btn--warn btn--sm',
                  text: 'Replace this computer’s copy with the sheet’s',
                  onclick: () => {
                    if (!window.confirm('This replaces the draft on screen. Continue?')) return;
                    App.restore.adoptRemote(remote);
                    closePanel();
                  },
                })
              );
            }
          },
        }),
        el('button', {
          class: 'btn',
          text: 'List drafts in the sheet',
          onclick: async () => {
            clear(status).append(el('span', { class: 'note', text: 'Loading…' }));
            let drafts;
            try {
              drafts = await App.restore.listRemote();
            } catch (err) {
              clear(status).append(
                el('span', { class: 'note note--warn', text: `Could not reach the sheet: ${err.message}` })
              );
              return;
            }
            clear(status);
            if (!drafts.length) {
              status.append(el('span', { class: 'note note--info', text: 'The sheet has no drafts yet.' }));
              return;
            }
            const current = store.exists() ? store.get().draftKey : null;
            status.append(
              el(
                'div',
                { class: 'draft-list' },
                drafts.map((d) =>
                  el('div', { class: `draft-list__row${d.draftKey === current ? ' is-current' : ''}` }, [
                    el('div', { class: 'draft-list__main' }, [
                      el('span', { class: 'draft-list__name', text: d.name || d.draftKey }),
                      el('span', {
                        class: 'draft-list__meta',
                        text: `${d.picks} picks · ${d.teams} teams · saved ${d.updated || '—'}`,
                      }),
                    ]),
                    d.draftKey === current
                      ? el('span', { class: 'pill', text: 'on screen' })
                      : el('button', {
                          class: 'btn btn--sm',
                          text: 'Load',
                          onclick: async () => {
                            if (!window.confirm(`Replace the draft on screen with "${d.name || d.draftKey}"?`)) return;
                            const remote = await App.sync.fetchRemote(d.draftKey);
                            if (!remote.found) {
                              window.alert('That draft could not be read back from the sheet.');
                              return;
                            }
                            App.restore.adoptRemote(remote);
                            closePanel();
                          },
                        }),
                  ])
                )
              )
            );
          },
        }),
        el('button', {
          class: 'btn btn--warn',
          text: 'Overwrite the sheet with this computer’s copy',
          onclick: async () => {
            if (!window.confirm('This replaces whatever is in the sheet. Continue?')) return;
            clear(status).append(el('span', { class: 'note', text: 'Overwriting…' }));
            await sync.forceOverwrite();
            clear(status).append(el('span', { class: 'note note--ok', text: 'Done.' }));
          },
        }),
      ]),
      status,
      el('hr'),
      el('div', { class: 'btn-stack' }, [
        el('button', {
          class: 'btn btn--ghost',
          text: 'Start a completely new draft',
          onclick: () => {
            if (!window.confirm('This clears the draft on screen. Export a backup first if you need one.')) return;
            persistence.clear();
            window.location.reload();
          },
        }),
      ])
    );
  }

  // --- chrome ----------------------------------------------------------------

  function buildChrome() {
    const bar = document.getElementById('topbar-actions');
    App.views.syncStatus.mount(bar);

    bar.append(
      el('button', {
        class: 'btn btn--ghost btn--sm',
        text: 'Undo',
        title: 'Undo the last pick',
        onclick: () => {
          const state = store.get();
          if (!state.picks.length) return;
          const last = state.picks[state.picks.length - 1];
          if (window.confirm(`Undo ${last.playerName} (${App.utils.money(last.price)})?`)) {
            store.undoLast();
          }
        },
      }),
      el('button', {
        class: 'btn btn--ghost btn--sm',
        text: 'Picks',
        onclick: () => openPanel('history'),
      }),
      el('button', {
        class: 'btn btn--ghost btn--sm',
        text: 'Export',
        onclick: () => openPanel('export'),
      }),
      el('button', {
        class: 'btn btn--ghost btn--sm',
        text: 'Backup',
        onclick: () => openPanel('recover'),
      }),
      el('button', {
        id: 'theme-toggle',
        class: 'btn btn--ghost btn--icon',
        onclick: () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'),
      })
    );

    document.getElementById('panel-close').addEventListener('click', closePanel);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('panel').hidden) closePanel();
    });
  }

  function banner(message, kind, actions) {
    const host = document.getElementById('banners');
    const node = el('div', { class: `banner banner--${kind}` }, [
      el('span', { text: message }),
      ...(actions || []).map((a) =>
        el('button', {
          class: 'btn btn--sm',
          text: a.label,
          onclick: () => {
            a.run();
            node.remove();
          },
        })
      ),
      el('button', { class: 'btn btn--ghost btn--icon', text: '×', onclick: () => node.remove() }),
    ]);
    host.append(node);
    return node;
  }

  // --- boot ------------------------------------------------------------------

  function startDraftScreen() {
    show('board');
    App.views.entry.render(document.getElementById('entry-host'));
    renderDraft();
  }

  async function boot() {
    screens = {
      setup: document.getElementById('screen-setup'),
      board: document.getElementById('screen-board'),
    };

    initTheme();
    sync.init({
      token: persistence.prefs().token || '',
      appsScriptUrl: persistence.prefs().appsScriptUrl || '',
    });

    // A second tab on a full-snapshot sync model is a genuine data-loss path.
    if (!persistence.claimSession()) {
      readOnly = true;
      store.setReadOnly(true);
      banner(
        'This draft is already open in another window. Enter picks there, or take over here.',
        'warn',
        [
          {
            label: 'Take over',
            run: () => {
              persistence.takeoverSession();
              readOnly = false;
              store.setReadOnly(false);
              window.location.reload();
            },
          },
        ]
      );
    }
    persistence.startHeartbeat();
    window.addEventListener('beforeunload', () => persistence.releaseSession());

    // One deployment writes to one spreadsheet, so the sheet can be holding a
    // draft that isn't this one. Say so plainly and let the operator choose --
    // silently overwriting would destroy the backup of a draft in progress.
    App.bus.on('sync:conflict', (info) => {
      if (document.getElementById('sync-conflict-banner')) return;
      const node = banner(
        info.differentDraft
          ? 'The spreadsheet is holding a different draft. Your picks are safe here, but they are not being backed up.'
          : 'The spreadsheet has a newer copy of this draft. Your picks are safe here, but they are not being backed up.',
        'warn',
        [
          {
            label: 'Use the sheet for this draft',
            run: () => {
              if (window.confirm('This replaces whatever the spreadsheet currently holds. Continue?')) {
                sync.forceOverwrite();
              }
            },
          },
          { label: 'Open Backup', run: () => openPanel('recover') },
        ]
      );
      node.id = 'sync-conflict-banner';
    });

    // A blocked write has to be visible. Silently dropping a pick in a mirror
    // window is exactly the failure the lock exists to prevent.
    App.bus.on('state:readonly-blocked', ({ action }) => {
      banner(
        `This window is a read-only mirror, so it can't ${action}. ` +
          'Use the window where the draft is already open, or take over here.',
        'warn',
        [
          {
            label: 'Take over',
            run: () => {
              persistence.takeoverSession();
              store.setReadOnly(false);
              window.location.reload();
            },
          },
        ]
      );
    });

    App.bus.on('storage:failed', () => {
      banner(
        'This browser stopped saving. Download a backup now and keep going.',
        'error',
        [{ label: 'Download backup', run: () => App.exporter.downloadStateJson() }]
      );
    });

    const playersResult = await App.players.load();
    if (!playersResult.ok) {
      banner('Player list unavailable — type player names in full instead.', 'warn', []);
    }

    // Persist and replicate on every mutation. Local first, always.
    store.subscribe((state, reason) => {
      if (reason === 'load' || reason === 'restore') {
        persistence.save(state);
      } else {
        persistence.save(state);
        sync.notify(reason);
      }
      if (document.body.dataset.screen === 'board') {
        renderDraft();
        if (reason === 'teams' || reason === 'settings') App.views.entry.refresh();
      }
    });

    buildChrome();

    const saved = App.restore.local();
    if (saved && saved.picks) {
      store.load(saved, 'load');
      startDraftScreen();
      banner(
        `Resumed your draft from ${new Date(saved.updatedAt).toLocaleString()} — ${saved.picks.length} picks.`,
        'info',
        []
      );
    } else {
      show('setup');
      App.views.setup.render(screens.setup.querySelector('.screen__body'), {
        onStart: startDraftScreen,
      });
    }

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {
        /* offline caching is a bonus, not a requirement */
      });
    }
  }

  App.readOnly = () => readOnly;
  document.addEventListener('DOMContentLoaded', boot);
})(window.DraftApp);

</script>
